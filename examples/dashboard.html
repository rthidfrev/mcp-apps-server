<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory snapshot</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 1.5rem; }
      main { max-width: 36rem; margin: auto; }
      h1 { font-size: 1.4rem; }
      dl { display: grid; grid-template-columns: 1fr auto; gap: 1rem; }
      dd { margin: 0; font-weight: 700; }
      .note { font-size: 0.9rem; opacity: 0.8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Inventory snapshot</h1>
      <dl>
        <dt>Available items</dt><dd>12</dd>
        <dt>Reserved items</dt><dd>3</dd>
      </dl>
      <p class="note">Static demonstration data. This page has no MCP Apps browser
        bridge, interactive controls or live refresh.</p>
    </main>
  </body>
</html>
